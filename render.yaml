services:
  - type: web
    name: grain-sandbox-catalog
    env: python
    region: singapore # Region terdekat dengan Indonesia (latency rendah)
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: GDRIVE_SERVICE_ACCOUNT_JSON
        value: /etc/secrets/credentials.json # Lokasi secret file di Render
      - key: GDRIVE_ROOT_FOLDER_ID
        sync: false # Diisi manual di Dashboard Render
      - key: ADMIN_PIN
        sync: false # Diisi manual di Dashboard Render
      - key: PORTAL_TITLE
        value: "GRAIN Sandbox Experiment Data Server"
      - key: PORTAL_SUBTITLE
        value: "Analog Geological & Tectonic Modeling Video/Photo Catalog"
