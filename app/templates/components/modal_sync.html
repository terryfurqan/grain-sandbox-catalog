<!-- Sync Modal -->
<div 
    x-show="showSyncModal" 
    x-transition:enter="ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4"
    style="display: none;"
    @keydown.escape.window="showSyncModal = false"
>
    <div 
        @click.outside="showSyncModal = false" 
        class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl p-6"
    >
        <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </div>
            <div>
                <h3 class="text-base font-bold text-white">Sinkronisasi Google Drive</h3>
                <p class="text-xs text-slate-400">Pindai ulang seluruh folder eksperimen ke database katalog.</p>
            </div>
        </div>

        <!-- Sync in Progress View -->
        <div x-show="isSyncing" class="py-6 text-center space-y-4">
            <div class="inline-flex p-3 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 animate-spin">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </div>
            <div>
                <h4 class="text-sm font-semibold text-white">Sedang Memindai Google Drive...</h4>
                <p class="text-xs text-slate-400 mt-1" x-text="'File terpindai: ' + syncScannedCount + ' item'"></p>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                <div class="bg-gradient-to-r from-amber-500 to-indigo-500 h-2 rounded-full animate-pulse w-full"></div>
            </div>
        </div>

        <!-- Sync PIN Form -->
        <div x-show="!isSyncing" class="space-y-4">
            <div x-show="syncError" class="p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span x-text="syncError"></span>
            </div>

            <div x-show="syncSuccess" class="p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-xs flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                <span x-text="syncSuccess"></span>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">PIN Admin</label>
                <input 
                    type="password" 
                    x-model="adminPinInput" 
                    placeholder="Masukkan PIN Admin (default: 123456)" 
                    class="w-full px-3.5 py-2 text-sm bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all"
                    @keydown.enter="submitSync()"
                >
            </div>

            <div class="flex items-center justify-end gap-2 pt-2">
                <button 
                    @click="showSyncModal = false" 
                    type="button"
                    class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition-colors"
                >
                    Tutup
                </button>
                <button 
                    @click="submitSync()" 
                    type="button"
                    class="px-4 py-2 bg-gradient-to-r from-amber-500 to-indigo-600 hover:from-amber-600 hover:to-indigo-700 text-white rounded-lg text-xs font-bold shadow-md shadow-indigo-600/20 transition-all active:scale-95 flex items-center gap-1.5"
                >
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span>Mulai Sinkronisasi</span>
                </button>
            </div>
        </div>
    </div>
</div>
