<!-- Video Player Modal -->
<div 
    x-show="activeModal === 'video'" 
    x-transition:enter="ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4"
    style="display: none;"
    @keydown.escape.window="closeMediaModal()"
>
    <div 
        @click.outside="closeMediaModal()" 
        class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-5xl overflow-hidden shadow-2xl flex flex-col"
    >
        <!-- Modal Header -->
        <div class="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-900/90">
            <div class="flex items-center gap-3 overflow-hidden">
                <span class="p-2 rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </span>
                <div class="truncate">
                    <h3 class="text-sm font-semibold text-white truncate" x-text="currentMedia.name"></h3>
                    <p class="text-xs text-slate-400 truncate" x-text="currentMedia.relative_path || currentMedia.name"></p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a 
                    :href="'/api/download/' + currentMedia.file_id + '?filename=' + encodeURIComponent(currentMedia.name)" 
                    class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg text-xs flex items-center gap-1 transition-colors"
                    title="Download Video Asli dari GDrive"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span class="hidden sm:inline">Download</span>
                </a>
                <button 
                    @click="closeMediaModal()" 
                    class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Video Player Canvas -->
        <div class="relative bg-black flex items-center justify-center min-h-[300px] max-h-[70vh]">
            <video 
                id="videoPlayerElement"
                class="w-full h-auto max-h-[70vh] object-contain"
                controls 
                autoplay
                playsinline
                preload="auto"
                :src="currentMedia.file_id ? '/api/stream/video/' + currentMedia.file_id : ''"
            >
                Browser Anda tidak mendukung HTML5 video tag.
            </video>
        </div>

        <!-- Video Controls Bar (Playback speed, size badge) -->
        <div class="px-5 py-3 bg-slate-900 border-t border-slate-800 flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex items-center gap-2">
                <span class="text-slate-400">Kecepatan:</span>
                <div class="flex bg-slate-800 rounded-lg p-0.5 border border-slate-700">
                    <template x-for="speed in [0.25, 0.5, 0.75, 1.0, 1.5, 2.0]" :key="speed">
                        <button 
                            @click="setPlaybackSpeed(speed)" 
                            :class="playbackRate === speed ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-300 hover:text-white'"
                            class="px-2 py-0.5 rounded text-[11px] transition-colors"
                            x-text="speed + 'x'"
                        ></button>
                    </template>
                </div>
            </div>

            <div class="flex items-center gap-4 text-slate-400">
                <span x-text="'Ukuran: ' + (currentMedia.size_formatted || 'N/A')"></span>
                <span class="inline-flex items-center gap-1 text-emerald-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    GDrive Stream
                </span>
            </div>
        </div>
    </div>
</div>

<!-- Image Lightbox Modal -->
<div 
    x-show="activeModal === 'image'" 
    x-transition:enter="ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4"
    style="display: none;"
    @keydown.escape.window="closeMediaModal()"
>
    <div 
        @click.outside="closeMediaModal()" 
        class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-5xl overflow-hidden shadow-2xl flex flex-col"
    >
        <!-- Modal Header -->
        <div class="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-900">
            <div class="flex items-center gap-3 overflow-hidden">
                <span class="p-2 rounded-lg bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </span>
                <div class="truncate">
                    <h3 class="text-sm font-semibold text-white truncate" x-text="currentMedia.name"></h3>
                    <p class="text-xs text-slate-400 truncate" x-text="currentMedia.relative_path || currentMedia.name"></p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a 
                    :href="'/api/download/' + currentMedia.file_id + '?filename=' + encodeURIComponent(currentMedia.name)" 
                    class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg text-xs flex items-center gap-1 transition-colors"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span class="hidden sm:inline">Download Asli</span>
                </a>
                <button 
                    @click="closeMediaModal()" 
                    class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Image Canvas -->
        <div class="relative bg-black/60 flex items-center justify-center p-2 min-h-[400px] max-h-[75vh]">
            <img 
                :src="currentMedia.file_id ? '/api/preview/image/' + currentMedia.file_id : ''" 
                :alt="currentMedia.name" 
                class="max-w-full max-h-[75vh] object-contain rounded shadow-lg"
            >
        </div>

        <!-- Footer Bar -->
        <div class="px-5 py-3 bg-slate-900 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
            <span x-text="'Ukuran File: ' + (currentMedia.size_formatted || 'N/A')"></span>
            <span x-text="'Dimodifikasi: ' + (currentMedia.last_modified ? new Date(currentMedia.last_modified).toLocaleString() : 'N/A')"></span>
        </div>
    </div>
</div>
