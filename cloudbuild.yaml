# ==============================================================================
# Google Cloud Build Pipeline - FinOps Optimized
# Minimal build duration, automatic cache, and hard-capped Cloud Run deployment
# ==============================================================================
steps:
  # 1. Build Docker image with caching enabled
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-southeast2-docker.pkg.dev//grain-repo/grain-server:latest'
      - '.'
    id: 'build-image'

  # 2. Push image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast2-docker.pkg.dev//grain-repo/grain-server:latest'
    id: 'push-image'

  # 3. Deploy to Cloud Run with strict FinOps Hard-Caps
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'grain-server'
      - '--image=asia-southeast2-docker.pkg.dev//grain-repo/grain-server:latest'
      - '--region=asia-southeast2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--concurrency=80'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--timeout=60s'
      - '--cpu-throttling'
      - '--execution-environment=gen2'
    id: 'deploy-service'

images:
  - 'asia-southeast2-docker.pkg.dev//grain-repo/grain-server:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
